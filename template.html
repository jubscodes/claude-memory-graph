<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23c2410c'/%3E%3C/svg%3E">
<style>
/*__FONTS__*/
/* Themes. The canvas reads these same tokens, so a theme is just one block here.
   --sat/--lum: project palette; --region: workspace fill alpha; --glow: node blur px;
   --grid: background grid color (transparent = none); --font: UI + canvas type;
   --hues: optional fixed workspace hues (else golden-angle spread);
   --card-*: floating card material (fill, border, shadow, backdrop blur), --radius, --clip (card outline),
   --field: input/button fill inside cards; --scan: full-screen overlay (scanlines). */
:root, :root[data-theme="paper"]{
  --bg:#f6f4ef; --surface:#fffdf8; --ink:#1d1b17; --muted:#77716a; --line:#d9d3c8;
  --edge:rgba(40,34,26,.16); --edge-hi:rgba(40,34,26,.75); --hub:#1d1b17; --focus:#c2410c;
  --sat:62; --lum:48; --region:.07; --glow:0; --grid:transparent; --hues:;
  --font:ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --card-bg:#fffdf8; --card-border:1px solid #e3ddd2; --card-blur:none; --radius:14px; --clip:none;
  --card-shadow:0 1px 2px rgba(40,34,26,.06),0 10px 28px rgba(40,34,26,.09);
  --field:#f6f4ef; --scan:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#121110; --surface:#1b1a18; --ink:#ece8e1; --muted:#9a948b; --line:#33302b;
    --edge:rgba(236,232,225,.13); --edge-hi:rgba(236,232,225,.8); --hub:#ece8e1; --focus:#fb923c;
    --sat:60; --lum:58; --region:.08;
    --card-bg:rgba(30,29,27,.62); --card-border:1px solid rgba(236,232,225,.1); --card-blur:blur(18px) saturate(140%);
    --card-shadow:0 12px 36px rgba(0,0,0,.4); --field:rgba(255,255,255,.06);
  }
}
/* ink: frosted smoked glass */
:root[data-theme="ink"]{
  --bg:#121110; --surface:#1b1a18; --ink:#ece8e1; --muted:#9a948b; --line:#33302b;
  --edge:rgba(236,232,225,.13); --edge-hi:rgba(236,232,225,.8); --hub:#ece8e1; --focus:#fb923c;
  --sat:60; --lum:58; --region:.08;
  --card-bg:rgba(30,29,27,.62); --card-border:1px solid rgba(236,232,225,.1); --card-blur:blur(18px) saturate(140%);
  --card-shadow:0 12px 36px rgba(0,0,0,.4); --field:rgba(255,255,255,.06);
}
/* blueprint: translucent drafting overlays, hairline borders, square corners */
:root[data-theme="blueprint"]{
  --bg:#0f3a6b; --surface:#134577; --ink:#e8f1ff; --muted:#9fbde0; --line:#2f6aa6;
  --edge:rgba(232,241,255,.22); --edge-hi:rgba(255,255,255,.9); --hub:#ffffff; --focus:#ffd166;
  --sat:40; --lum:80; --region:.05; --grid:rgba(232,241,255,.07);
  --font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card-bg:rgba(15,58,107,.42); --card-border:1px solid rgba(232,241,255,.5); --card-blur:blur(3px);
  --card-shadow:none; --radius:2px; --field:rgba(232,241,255,.07);
}
/* neon: airy dark glass, soft glow only (kept light: Cyber is the heavy one) */
:root[data-theme="neon"]{
  --bg:#0e0d18; --surface:#16142a; --ink:#f1eeff; --muted:#9a94b8; --line:#2c2846;
  --edge:rgba(190,175,255,.09); --edge-hi:rgba(220,210,255,.75); --hub:#f1eeff; --focus:#7dffb0;
  --sat:88; --lum:68; --region:.035; --glow:4;
  --card-bg:rgba(26,23,44,.5); --card-border:1px solid rgba(190,175,255,.16); --card-blur:blur(16px) saturate(130%);
  --card-shadow:0 8px 28px rgba(0,0,0,.3),0 0 22px rgba(140,110,255,.08); --radius:18px;
  --field:rgba(255,255,255,.04);
}
/* print: opaque paper, hard rules, no shadow */
:root[data-theme="print"]{
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#666666; --line:#cccccc;
  --edge:rgba(0,0,0,.2); --edge-hi:rgba(0,0,0,.85); --hub:#111111; --focus:#111111;
  --sat:0; --lum:38; --region:.035;
  --font:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --card-bg:#ffffff; --card-border:1.5px solid #111111; --card-shadow:none; --radius:0; --field:#ffffff;
}
/* claude (inspired by, not affiliated): palette and type from Anthropic's published brand guidelines
   (github.com/anthropics/skills, brand-guidelines): dark #141413, light #faf9f5, mid gray #b0aea5,
   light gray #e8e6dc; accents orange #d97757, blue #6a9bcc, green #788c5d (cycled); Poppins headings, Lora body. */
:root[data-theme="claude"]{
  --bg:#faf9f5; --surface:#ffffff; --ink:#141413; --muted:#73726c; --line:#e8e6dc;
  --edge:rgba(176,174,165,.55); --edge-hi:rgba(217,119,87,.9); --hub:#141413; --focus:#d97757;
  --sat:48; --lum:58; --region:.07; --hues:15,210,86;
  --font:"Poppins",Arial,sans-serif; --font-body:"Lora",Georgia,serif;
  --card-bg:#ffffff; --card-border:1px solid #e8e6dc; --card-blur:none; --radius:12px;
  --card-shadow:0 1px 2px rgba(20,20,19,.04),0 6px 20px rgba(20,20,19,.06); --field:#faf9f5;
}
/* cursor (inspired by, not affiliated): flat editor chrome, syntax-highlight palette, mono labels */
:root[data-theme="cursor"]{
  --bg:#141414; --surface:#1d1d1d; --ink:#e6e6e6; --muted:#8a8a8a; --line:#2c2c2c;
  --edge:rgba(230,230,230,.08); --edge-hi:rgba(97,175,239,.9); --hub:#e6e6e6; --focus:#61afef;
  --sat:62; --lum:66; --region:.04; --hues:207,286,29,95,173,48;
  --font:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --card-bg:#1b1b1b; --card-border:1px solid #2c2c2c; --card-blur:none; --radius:8px;
  --card-shadow:0 10px 30px rgba(0,0,0,.45); --field:#242424;
}
/* skeuo: linen desk, stitched cream-paper cards, glossy buttons, embossed type, glossy marble nodes.
   --canvas-bg:transparent lets the CSS linen texture show through the canvas; --gloss turns on node highlights. */
:root[data-theme="skeuo"]{
  --bg:#e7e1d3; --surface:#f8f4ea; --ink:#3b3023; --muted:#86795f; --line:#cdbf9f;
  --edge:rgba(80,60,30,.22); --edge-hi:rgba(150,80,20,.85); --hub:#4a3a28; --focus:#b5651d;
  --sat:58; --lum:46; --region:.07; --hues:205,12,145,40,280,175;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --canvas-bg:transparent; --gloss:1;
  --bg-image:repeating-linear-gradient(0deg,rgba(120,100,60,.05) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(120,100,60,.05) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at 50% 30%,#f1ece0,#d9d0bb);
  --card-bg:linear-gradient(#fbf8f0,#eee6d4); --card-border:1px solid #bfb08e; --card-blur:none; --radius:12px;
  --card-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(70,50,20,.25),0 8px 22px rgba(70,50,20,.22);
  --stitch:1.5px dashed rgba(140,110,60,.45);
  --field:linear-gradient(#ffffff,#e8dfcb); --text-glow:0 1px 0 rgba(255,255,255,.85);
}
/* cyber: monochrome green-phosphor terminal (1980s command center): box-drawing double lines,
   CRT bloom, scanlines + vignette, Plex Mono. Workspaces differ by slight hue/lightness shifts only. */
:root[data-theme="cyber"]{
  --bg:#010805; --surface:#03120a; --ink:#b8ffd4; --muted:#3f9a66; --line:#0d4a2a;
  --edge:rgba(0,204,106,.16); --edge-hi:rgba(120,255,180,.95); --hub:#7dffb2; --focus:#eafff1;
  --sat:100; --lum:44; --region:.04; --glow:8; --grid:rgba(0,204,106,.06); --hues:150,138,162,126,174;
  --font:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card-bg:rgba(1,12,6,.86); --card-border:3px double rgba(0,204,106,.75); --card-blur:blur(2px);
  --card-shadow:0 0 14px rgba(0,204,106,.22),inset 0 0 22px rgba(0,204,106,.06); --radius:0;
  --field:rgba(0,204,106,.06); --text-glow:0 0 6px rgba(0,255,136,.4);
  --scan:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),
         radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 var(--font);overflow:hidden;text-shadow:var(--text-glow,none);background-image:var(--bg-image,none)}
/* floating cards: one material per theme, set by the --card-* tokens */
header,#legend,#panel,#themes,#tip,#zoom{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);
  box-shadow:var(--card-shadow);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);clip-path:var(--clip);
  outline:var(--stitch,none);outline-offset:-5px}
#zoom{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:3px;padding:4px;z-index:4}
#zoom button{width:32px;height:32px;padding:0;font-size:16px;line-height:1;border-radius:min(8px,var(--radius))}
.mobile-only{display:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:var(--scan);z-index:20}
/* --hdr is the header's live height (set from JS), so nothing slides under a wrapped header */
#themes{position:fixed;right:16px;top:calc(var(--hdr,56px) + 28px);width:230px;padding:6px;z-index:7}
#themes button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:8px;padding:6px 8px;
  text-align:left;background:transparent;font-size:13px}
#themes button:hover,#themes button:focus-visible{background:var(--bg)}
#themes button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--muted)}
.prev{width:44px;height:26px;border-radius:6px;flex:none;position:relative;border:1px solid rgba(127,127,127,.3);overflow:hidden}
.prev i{position:absolute;width:7px;height:7px;border-radius:50%}
.prev i:nth-child(1){left:7px;top:5px}.prev i:nth-child(2){left:19px;top:13px;width:9px;height:9px}.prev i:nth-child(3){left:31px;top:6px}
#c{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
header{position:fixed;top:16px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:9px 10px 9px 18px;z-index:6}
h1{font-size:15px;font-weight:600;margin:0 8px 0 0;letter-spacing:-.01em}
.stat{color:var(--muted);font-size:12px}
.credit{color:var(--muted);font-size:12px;margin-right:auto;padding-left:10px;border-left:1px solid var(--line)}
.credit a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.credit a:hover,.credit a:focus-visible{border-bottom-color:var(--ink)}
.credit a.star{margin-left:8px;padding:2px 9px;border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));background:var(--field)}
.credit a.star:hover,.credit a.star:focus-visible{border-color:var(--focus);color:var(--focus)}
@media (max-width:1280px){.stat{display:none}.credit{border-left:0;padding-left:0}}
input[type=search]{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));
  padding:7px 14px;font:inherit;width:180px;max-width:100%}
button{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:min(999px,calc(var(--radius) * 99));
  padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
button[aria-pressed="false"]{opacity:.4}
#types button[aria-pressed="false"]{text-decoration:line-through}
#legend h2{display:flex;align-items:center;justify-content:space-between}
#showall{border:0;background:none;padding:0;font-size:11px;text-transform:none;letter-spacing:0;color:var(--focus);text-decoration:underline;text-underline-offset:2px}
.key.hint{margin:-2px 4px 8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#legend{position:fixed;left:16px;bottom:16px;max-height:45vh;overflow:auto;padding:10px 8px;width:240px;z-index:5}
#legend h2,#panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 4px 6px;font-weight:600}
.proj{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:8px;padding:4px 6px;text-align:left;background:transparent}
.proj:hover{background:var(--bg)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.proj .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.proj.ws{margin-top:4px}
.key{margin:6px 4px 12px;font-size:11px;line-height:1.45;color:var(--muted)}
#types{display:flex;flex-wrap:wrap;gap:4px;margin:0 2px}
#types button{padding:3px 9px;font-size:11px}
.proj.sub{padding-left:24px;font-size:12px}
.proj.sub .sw{width:8px;height:8px}
#panel{position:fixed;top:calc(var(--hdr,56px) + 28px);right:16px;width:340px;max-height:calc(100vh - var(--hdr,56px) - 44px);overflow:auto;padding:16px 18px;display:none;z-index:5}
#panel.open{display:block}
#panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
#panel .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
#panel .desc{margin:0 0 12px}
#panel.wide{width:460px}
#panel .body{font-size:13px;line-height:1.6;margin:4px 0 14px;font-family:var(--font-body,inherit)}
#panel .desc{font-family:var(--font-body,inherit)}
#panel .body p{margin:0 0 9px}
#panel .body h4{font-size:13px;margin:12px 0 4px}
#panel .body ul{list-style:disc;padding-left:18px;margin:0 0 9px}
#panel .body li{margin:2px 0}
#panel .body code{font:12px ui-monospace,Menlo,monospace;background:var(--field);padding:1px 4px;border-radius:4px;display:inline;margin:0;color:var(--ink);word-break:break-word}
#panel .body pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;background:var(--field);padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:0 0 9px;border-radius:min(8px,var(--radius))}
#panel .body pre.tbl{margin:0;padding:1px 10px;border-radius:0}
#panel .body a{color:var(--ink)}
#panel .body .wl{display:inline;border:0;padding:0;background:none;font:inherit;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
#panel .body .wl.dead{color:var(--muted);cursor:help}
#panel code{font:11px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all;display:block;margin-bottom:12px}
#panel ul{list-style:none;margin:0;padding:0}
#panel li button{border:0;background:transparent;padding:3px 0;text-align:left;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
#close{position:absolute;top:10px;right:10px;padding:2px 9px}
#panel .hits li button{text-decoration:none;width:100%;padding:6px 6px;border-radius:8px;line-height:1.35}
#panel .hits li button:hover,#panel .hits li button:focus-visible{background:var(--bg)}
#panel .hits .pj{color:var(--muted);font-size:12px}
#panel .hits .sn{color:var(--muted);font-size:12px}
#panel .wsh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 6px 2px;font-weight:600}
#panel .back{border:0;background:transparent;padding:0;margin-bottom:8px;color:var(--muted);text-decoration:underline}
#tip{position:fixed;pointer-events:none;padding:7px 10px;font-size:12px;max-width:280px;display:none;z-index:8}
#tip b{display:block;font-weight:600}
#tip span{color:var(--muted)}
@media (max-width:640px){
  #legend{display:none}
  .mobile-only{display:inline-flex}
  /* filters as a bottom sheet with roomier rows (HIG touch targets) */
  #legend.open{display:block;left:16px;right:16px;width:auto;max-height:60vh;z-index:7}
  #legend.open .proj{padding:10px 8px}
  #zoom{bottom:auto;top:calc(var(--hdr,56px) + 28px)}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:50vh}
  #themes{top:auto;bottom:16px;left:16px;right:16px;width:auto}
  input[type=search]{width:100%}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Graph of Claude memories grouped by project"></canvas>
<header>
  <h1>Memory Graph</h1><span class="stat" id="stat"></span>
  <span class="credit"><a href="https://github.com/jubscodes/claude-memory-graph" target="_blank" rel="noopener">claude-memory-graph</a>
    by <a href="https://github.com/jubscodes" target="_blank" rel="noopener">@jubscodes</a>
    <a class="star" href="https://github.com/jubscodes/claude-memory-graph" target="_blank" rel="noopener" title="Star the repo on GitHub">★ Star</a></span>
  <input type="search" id="q" placeholder="Search memories" aria-label="Search memories">
  <div class="tm">
    <button id="theme" aria-haspopup="menu" aria-expanded="false" aria-controls="themes">Theme: <span id="tname">Auto</span> ▾</button>
  </div>
  <button id="filters" class="mobile-only" aria-expanded="false" aria-controls="legend">Filters</button>
</header>
<div id="zoom" role="group" aria-label="Zoom">
  <button data-z="in" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <button data-z="out" aria-label="Zoom out" title="Zoom out (−)">−</button>
  <button data-z="fit" aria-label="Fit the whole graph" title="Fit (F or double-click empty space)">⤢</button>
</div>
<!-- outside the header so the header's clip-path and backdrop blur can't clip or flatten it -->
<div id="themes" role="menu" aria-label="Themes" hidden></div>
<nav id="legend" aria-label="Workspaces">
  <h2>Types</h2>
  <div id="types"></div>
  <p class="key">Shape shows the type. The biggest plain dots are project hubs; size grows with links.</p>
  <h2>Workspaces <button id="showall" hidden>Show all</button></h2>
  <p class="key hint">Click to focus · ⇧-click to add or remove · hover to preview</p>
  <div id="projs"></div></nav>
<aside id="panel" aria-live="polite"><button id="close" aria-label="Close">×</button><div id="pbody"></div></aside>
<div id="tip" role="tooltip"></div>
<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const cv = $('#c'), ctx = cv.getContext('2d');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// --- model: one hub per project, memories attached to their hub, plus [[link]] edges
const projects = [...new Set(DATA.nodes.map(n => n.project))]
  .sort((a,b) => a === 'home' ? -1 : b === 'home' ? 1 : DATA.nodes.filter(n=>n.project===b).length - DATA.nodes.filter(n=>n.project===a).length);
// each workspace gets a hue; its projects vary lightness around it
// workspace = group of related memory dirs, computed by build.py
const wsOf = Object.fromEntries(DATA.nodes.map(n => [n.project, n.workspace]));
const family = p => wsOf[p];
const families = [...new Set(projects.map(family))];
let famHue = {};  // set per theme in readTheme()
const famIdx = {}, projK = Object.fromEntries(projects.map(p => [p, famIdx[family(p)] = (famIdx[family(p)] ?? -1) + 1]));
// theme tokens, cached on theme change (getComputedStyle per node per frame would be slow)
let T = {};
function readTheme(){ const s = getComputedStyle(document.documentElement), g = v => s.getPropertyValue(v).trim();
  T = {bg:g('--bg'), ink:g('--ink'), edge:g('--edge'), edgeHi:g('--edge-hi'), hub:g('--hub'), focus:g('--focus'),
    sat:+g('--sat'), lum:+g('--lum'), region:+g('--region'), glow:+g('--glow'), grid:g('--grid'), font:g('--font'),
    canvasBg:g('--canvas-bg'), gloss:+g('--gloss') || 0};
  const hues = g('--hues').split(',').map(Number).filter(h => g('--hues') && !isNaN(h));
  famHue = Object.fromEntries(families.map((f,i) => [f, hues.length ? hues[i % hues.length] : (i * 137.508 + 20) % 360])); }
readTheme();
const pcolor = p => { const k = projK[p];
  return `hsl(${(famHue[family(p)] + k * 14) % 360} ${Math.max(0, T.sat - k * 4)}% ${T.lum + (k % 2 ? 10 : 0) - Math.floor(k/2) * 4}%)`; };
const wcolor = (w, a = 1, dl = 0) => `hsla(${famHue[w]} ${Math.max(0, T.sat - 5)}% ${T.lum + dl}% / ${a})`;
const size = Object.fromEntries(projects.map(p => [p, DATA.nodes.filter(n => n.project === p).length]));
const byId = new Map();
const hubs = projects.map((p,i) => {
  const fa = families.indexOf(family(p)) / families.length * Math.PI * 2, R = 260;
  const h = {id:'#'+p, hub:true, project:p, family:family(p), name:p,
    x:Math.cos(fa)*R + (Math.random()-.5)*60, y:Math.sin(fa)*R + (Math.random()-.5)*60, vx:0, vy:0};
  byId.set(h.id, h); return h;
});
const cr = h => 14 + 9 * Math.sqrt(size[h.project]);  // approximate settled radius of a project's cluster
// star tether: each smaller project hub orbits its workspace's biggest hub
const anchor = {};

    const r = radius(n) * Math.max(.6, Math.min(view.k,2)) + 4; if (d < Math.max(bd, r*r) && d < bd + r*r) { bd = d; best = n; } }
  return best; }
// A press only becomes a drag/pan after moving DRAG_PX; anything less is a click (hands wobble).
const DRAG_PX = 6;
let dragNode = null, panning = null, moved = false, press = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); moved = false;
  press = {x: e.offsetX, y: e.offsetY, node: pick(e.offsetX, e.offsetY), vx: view.x, vy: view.y}; });
cv.addEventListener('pointermove', e => {
  if (press && !moved && Math.hypot(e.offsetX - press.x, e.offsetY - press.y) >= DRAG_PX) {
    moved = true; cv.classList.add('drag'); $('#tip').style.display = 'none';
    if (press.node) { dragNode = press.node; kick(.12); } else { panning = press; touched = true; }
  }
  if (press && !moved) return;  // still within click tolerance
  if (dragNode) { [dragNode.x, dragNode.y] = toWorld(e.offsetX, e.offsetY); dragNode.vx = dragNode.vy = 0; return; }
  if (panning) { view.x = panning.vx - (e.offsetX - panning.x) / view.k; view.y = panning.vy - (e.offsetY - panning.y) / view.k; draw(); return; }
  const n = pick(e.offsetX, e.offsetY);
  if (n !== hover) { hover = n; cv.style.cursor = n ? 'pointer' : ''; draw(); }
  const tip = $('#tip');
  if (n) { tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, W - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    tip.innerHTML = n.hub ? `<b>${esc(n.name)}</b><span>${nodes.filter(m=>m.project===n.project).length} memories</span>`
      : `<b>${esc(n.name)}</b><span>${esc(n.project)} · ${esc(n.type)} · ${n.date}</span>`; }
  else tip.style.display = 'none'; });
cv.addEventListener('pointerup', e => { cv.classList.remove('drag');
  const clicked = press && !moved ? press.node : undefined;
  dragNode = null; panning = null; press = null;
  if (clicked !== undefined) open(clicked || null); });
cv.addEventListener('pointercancel', () => { cv.classList.remove('drag'); dragNode = panning = press = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); touched = true;
  const [wx, wy] = toWorld(e.offsetX, e.offsetY), k = Math.min(6, Math.max(.15, view.k * Math.exp(-e.deltaY * .0015)));
  view.k = k; view.x = wx - (e.offsetX - W/2) / k; view.y = wy - (e.offsetY - H/2) / k; draw(); }, {passive:false});
addEventListener('keydown', e => { if (e.key !== 'Escape' || !$('#themes').hidden) return;
  if (selected && query) showResults(); else open(null); });
$('#close').onclick = () => open(null);

// --- minimal, safe markdown for memory bodies: text is escaped first, then a few patterns are re-marked
const linkIdx = new Map();
nodes.forEach(n => [n.name, n.id.slice(n.project.length + 1)].forEach(k => {
  k = k.toLowerCase(); linkIdx.set(k, [...(linkIdx.get(k) || []), n]); }));
function resolveLink(t, from){
  t = t.trim().toLowerCase();
  const c = [...(linkIdx.get(t) || []), ...(linkIdx.get(t.replace(/-/g, '_')) || [])];
  return c.find(m => m.project === from.project) || c[0];
}
function md(src, from){
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]|#]+)[^\]]*\]\]/g, (m, t) => { const n = resolveLink(t, from);
      return n ? `<button class="wl" data-id="${esc(n.id)}">${t}</button>` : `<span class="wl dead" title="no memory with this name">${t}</span>`; })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null, fence = null, para = [];
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`); para = [];
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  for (const line of src.split('\n')) {
    if (fence) { if (/^```/.test(line)) { out.push(`<pre>${esc(fence.join('\n'))}</pre>`); fence = null; } else fence.push(line); continue; }
    if (/^```/.test(line)) { flush(); fence = []; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (h) { flush(); out.push(`<h4>${inline(h[2])}</h4>`); }
    else if (li) { if (para.length) { const l = list; list = null; flush(); list = l; } (list = list || []).push(`<li>${inline(li[1])}</li>`); }
    else if (/^\s*\|/.test(line)) { flush(); out.push(`<pre class="tbl">${esc(line)}</pre>`); }
    else if (!line.trim()) flush();
    else { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } para.push(line.trim()); }
  }
  if (fence) out.push(`<pre>${esc(fence.join('\n'))}</pre>`);
  flush();
  return out.join('');
}

function open(n){
  selected = n; const p = $('#panel');
  if (!n) { p.classList.remove('open'); draw(); return; }
  const out = links.filter(l => l.s === n).map(l => l.t), inn = links.filter(l => l.t === n).map(l => l.s);
  const list = (title, arr) => arr.length ? `<h2>${title}</h2><ul>${arr.map(m => `<li><button data-id="${esc(m.id)}">${esc(m.name)}<span style="color:var(--muted)"> · ${esc(m.project)}</span></button></li>`).join('')}</ul>` : '';
  $('#pbody').innerHTML = (query ? '<button class="back" data-back>← results</button>' : '') + (n.hub
    ? `<h3>${esc(n.name)}</h3><div class="meta">project · ${nodes.filter(m=>m.project===n.project).length} memories</div>` +
      list('Memories', nodes.filter(m => m.project === n.project).sort((a,b) => b.date.localeCompare(a.date)))
    : `<h3>${esc(n.name)}</h3><div class="meta"><span class="sw" style="display:inline-block;background:${pcolor(n.project)}"></span> ${esc(n.project)} · ${esc(n.type)} · modified ${n.date} · ${(n.size/1024).toFixed(1)} KB</div>
       <p class="desc">${esc(n.desc || '—')}</p><code>${esc(n.file)}</code>` +
       (n.body ? `<h2>Memory</h2><div class="body">${md(n.body, n)}</div>` : '') +
       list('Links to', out) + list('Linked from', inn));
  p.classList.toggle('wide', !n.hub && !!n.body);
  p.classList.add('open'); draw();
}
$('#pbody').onclick = e => {
  if (e.target.closest('[data-back]')) return showResults();
  const b = e.target.closest('[data-id]'); if (!b) return;
  const n = byId.get(b.dataset.id); touched = true;  // stop auto-fit from undoing the jump
  view.x = n.x; view.y = n.y; view.k = Math.max(view.k, 1.4); open(n); };

new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('header').offsetHeight + 'px'))
  .observe($('header'));
// null = never chosen (use Omarchy when present); '' = the viewer explicitly picked Auto
let saved = null; try { saved = localStorage.getItem('cmg-theme'); } catch {}
setTheme(saved !== null && THEMES.some(t => t.id === saved) ? saved : DATA.omarchy ? 'omarchy' : '');
// Live Omarchy theme: build.py writes a sidecar script beside this file and a theme-set hook rewrites it.
// Re-run it every 2s (a local file, no network) and re-theme when the tokens changed.
if (DATA.omarchy && DATA.omarchy.sidecar && location.protocol === 'file:') {
  let last = JSON.stringify({...DATA.omarchy, sidecar: undefined});
  window.__cmgOmarchy = o => { const now = JSON.stringify(o);
    if (now === last || !o || !o.tokens || !o.preview) return;
    last = now; const open = !$('#themes').hidden;
    omarchyCss(o); renderThemeMenu(); setTheme(theme); if (open) menu(true); };
  const poll = () => { if (document.hidden) return;
    const s = document.createElement('script');
    s.src = encodeURIComponent(DATA.omarchy.sidecar) + '?' + Date.now();
    s.onload = s.onerror = () => s.remove(); document.head.appendChild(s); };
  poll(); setInterval(poll, 2000);
  document.addEventListener('visibilitychange', poll);
}
addEventListener('resize', resize); resize();
// Warm-up: run the chaotic first part of the layout off-screen, then show only a calm final settle.
// The step budget shrinks for big graphs (each step is O(n²)) so the page never stalls.
Object.assign(PHYS, {damp: .82, cap: 30});
for (let i = 0, N = Math.min(400, Math.floor(4e7 / (all.length * all.length))); i < N && alpha > .12; i++) step();
Object.assign(PHYS, {damp: .55, cap: 10});
all.forEach(n => { n.vx *= .2; n.vy *= .2; });  // hand over to the calm physics without a jolt
if (REDUCE_MOTION) { while (alpha > .02) step(); alpha = 0; }  // HIG: appear settled, no settling animation
alpha = Math.min(alpha, .2); fit(true);
requestAnimationFrame(tick);

// --- view controls (review fixes: a way back to the full view, discoverable zoom, keyboard)
function fitView(){ touched = false; if (!running) { running = true; requestAnimationFrame(tick); } }
function zoomBy(f){ touched = true; view.k = Math.min(6, Math.max(.15, view.k * f)); draw(); }
$('#zoom').onclick = e => { const z = e.target.closest('[data-z]')?.dataset.z;
  if (z === 'in') zoomBy(1.25); else if (z === 'out') zoomBy(.8); else if (z === 'fit') fitView(); };
cv.addEventListener('dblclick', e => { if (!pick(e.offsetX, e.offsetY)) fitView(); });
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'f' || e.key === 'F') fitView();
  else if (e.key === '+' || e.key === '=') zoomBy(1.25);
  else if (e.key === '-') zoomBy(.8);
});
$('#filters').onclick = () => { const o = $('#legend').classList.toggle('open'); $('#filters').setAttribute('aria-expanded', o); };
</script>
</body>
